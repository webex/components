# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: components

on:
  push:
    branches:
      - master

jobs:
  semantic-release:
    name: semantic-latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # Keep Node 20 for the existing build and Storybook dependencies.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.13.1
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.13.1
          package-manager-cache: false
      - name: Build Storybook
        run: |
            rm -rf docs/storybook
            npm run storybook:build
      - name: Push Storybook updates to Github
        run: |
            # Check if there's anything to commit
            if [ -n "$(git status --porcelain)" ]; then
              git pull
              git add docs/storybook
              git commit -m "docs: build Storybook [skip ci]"
              git push origin master
            fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
